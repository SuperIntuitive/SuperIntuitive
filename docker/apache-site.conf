<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        DirectoryIndex index.php index.html
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <DirectoryMatch "^/var/www/html/domains/[^/]+/media(?:/|$)">
        AllowOverride None
        Options -ExecCGI -Includes -Indexes
        # SVG and other uploaded documents must not run scripts on the site origin.
        Header always set Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'"
        Header always set X-Content-Type-Options "nosniff"
        <FilesMatch "(?i)\.(php[0-9]*|phtml|pht|phar|cgi|pl|py|sh|shtml)(\.|$)">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    LimitRequestBody 33554432
</VirtualHost>
