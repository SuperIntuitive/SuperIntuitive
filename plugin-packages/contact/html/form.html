<section class="si-contact si-contact-system">
<main id="si_default_main" class="si-content si-contact-page" tabindex="-1">
  <p class="si-eyebrow">CONTACT / SUPERINTUITIVE</p>
  <h1>Let&rsquo;s talk.</h1>
  <p class="si-contact-lead">A question about our software, a project you have in mind, or an idea worth sharing. Tell us what you&rsquo;re thinking.</p>
  <form id="si_contact_form">
    <div class="si-contact-fields">
      <div class="si-contact-field"><label for="si_contact_name">Your name</label><input id="si_contact_name" name="name" type="text" autocomplete="name" maxlength="100" required></div>
      <div class="si-contact-field"><label for="si_contact_email">Email address</label><input id="si_contact_email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="si-contact-field si-contact-wide"><label for="si_contact_topic">What is it about?</label><select id="si_contact_topic" name="topic"><option>General</option><option>SuperIntuitive CMS</option><option>Gameatude</option><option>SIPL</option></select></div>
      <div class="si-contact-field si-contact-wide"><label for="si_contact_message">Your message</label><textarea id="si_contact_message" name="message" rows="7" maxlength="5000" required></textarea><small>Up to 5,000 characters. We&rsquo;ll use your email address to reply.</small></div>
    </div>
    <div class="si-contact-honey" aria-hidden="true"><label for="si_contact_website">Leave this field blank</label><input id="si_contact_website" name="website" type="text" autocomplete="off" tabindex="-1"></div>
    <div class="si-actions"><button id="si_contact_submit" class="si-button" type="submit" disabled>Send message <span aria-hidden="true">&rarr;</span></button><span class="si-contact-private">Your message goes to our team&rsquo;s private inbox.</span></div>
    <p id="si_contact_status" class="si-contact-status" role="status" aria-live="polite" tabindex="-1"></p>
    <noscript><p>Please enable JavaScript to use this contact form.</p></noscript>
  </form>
</main>
</section>
