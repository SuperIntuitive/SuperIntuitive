<section class="si-contact si-contact-system">
<main id="si_default_main" class="si-content si-inbox-page" tabindex="-1">
  <p class="si-eyebrow">PRIVATE / ADMINISTRATION</p>
  <h1>Contact messages</h1>
  <p class="si-inbox-lead">Messages sent through the website. Only administrators can view this inbox.</p>
  <div class="si-inbox-toolbar"><span id="si_inbox_counts">Loading messages...</span><button id="si_inbox_refresh" class="si-small-button" type="button">Refresh</button></div>
  <p id="si_inbox_status" role="status" aria-live="polite"></p>
  <div id="si_inbox_messages"></div>
  <button id="si_inbox_more" class="si-small-button" type="button" hidden>Load more messages</button>
  <noscript><p>Please enable JavaScript to view the inbox.</p></noscript>
</main>
</section>
