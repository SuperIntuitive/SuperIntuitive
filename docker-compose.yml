services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SI_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${SI_DB_NAME:-super_intuitive}
      MARIADB_USER: ${SI_DB_USER:-super_intuitive}
      MARIADB_PASSWORD: ${SI_DB_PASSWORD:-super_intuitive}
      MARIADB_ROOT_PASSWORD: ${SI_DB_ROOT_PASSWORD:-super_intuitive_root}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mariadb_data: